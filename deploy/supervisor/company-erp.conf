[program:company-erp-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /srv/company-erp/current/backend/artisan queue:work --queue=default,etax --sleep=3 --tries=3 --timeout=60 --max-time=3600
directory=/srv/company-erp/current/backend
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/log/company-erp/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
